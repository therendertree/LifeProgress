<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人生进度</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

  <!-- ══ Sidebar ══ -->
  <nav class="sidebar">
    <div class="logo">人生进度<span>LIFE PROGRESS</span></div>
    <div class="nav-item active" data-page="home">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/>
        <rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/>
      </svg>
      首页
    </div>
    <div class="nav-item" data-page="plans">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M2 8h12M2 4h8M2 12h10"/>
      </svg>
      所有计划
    </div>
    <div class="nav-item" data-page="events">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="3" width="12" height="12" rx="1.5"/>
        <path d="M5 1v4M11 1v4M2 7h12"/>
      </svg>
      重要事件
    </div>
    <div class="nav-item" data-page="archive">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M2 5a1 1 0 011-1h10a1 1 0 011 1v1H2V5zM2 6v7a1 1 0 001 1h10a1 1 0 001-1V6"/><path d="M6 9h4"/>
      </svg>
      归档
    </div>
  </nav>

  <!-- ══ Main Content ══ -->
  <main class="main">

    <!-- 首页 -->
    <div class="page active" id="page-home">
      <h1 class="page-title">今日进度</h1>
      <p class="page-sub" id="today-date"></p>

      <div class="section-header">
        <span class="section-title">当前计划</span>
        <button class="btn btn-sm btn-accent" onclick="openAddPlan()">＋ 新建计划</button>
      </div>
      <div id="home-plans-list"></div>

      <div class="divider"></div>

      <div class="section-header">
        <span class="section-title">打卡热力图 — 当前计划</span>
        <div class="tabs" id="heatmap-plan-tabs"></div>
      </div>
      <div id="home-heatmap"></div>
    </div>

    <!-- 所有计划 -->
    <div class="page" id="page-plans">
      <h1 class="page-title">所有计划</h1>
      <p class="page-sub">管理你的全部长期目标</p>
      <div class="section-header">
        <span class="section-title">计划列表</span>
        <button class="btn btn-sm btn-accent" onclick="openAddPlan()">＋ 新建计划</button>
      </div>
      <div id="all-plans-list"></div>
      <div class="divider"></div>
      <div class="section-header">
        <span class="section-title">打卡热力图 — 所有计划聚合</span>
      </div>
      <div id="all-heatmap"></div>
      <div class="heatmap-legend">
        <span>少</span>
        <div style="width:12px;height:12px;border-radius:2px;background:var(--bg3)"></div>
        <div style="width:12px;height:12px;border-radius:2px;background:rgba(200,240,74,0.35)"></div>
        <div style="width:12px;height:12px;border-radius:2px;background:rgba(200,240,74,0.65)"></div>
        <div style="width:12px;height:12px;border-radius:2px;background:#c8f04a"></div>
        <span>多</span>
      </div>
    </div>

    <!-- 重要事件 -->
    <div class="page" id="page-events">
      <h1 class="page-title">重要事件</h1>
      <p class="page-sub">倒计时提醒，把握每一个重要时刻</p>
      <div class="section-header">
        <span class="section-title">即将到来</span>
        <button class="btn btn-sm btn-accent" onclick="openAddEvent()">＋ 添加事件</button>
      </div>
      <div id="events-list"></div>
    </div>

    <!-- 归档 -->
    <div class="page" id="page-archive">
      <h1 class="page-title">历史归档</h1>
      <p class="page-sub">那些已经过去的重要时刻</p>
      <div class="timeline" id="archive-list"></div>
    </div>

  </main>

  <!-- ══ Modal: 新建计划 ══ -->
  <div class="modal-overlay" id="modal-plan">
    <div class="modal">
      <div class="modal-title">新建计划</div>
      <div class="form-group">
        <label class="form-label">计划名称</label>
        <input class="form-input" id="plan-name" placeholder="例如：健身 / 背单词" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">类型</label>
          <select class="form-input" id="plan-type" onchange="togglePlanTypeHint()">
            <option value="equal">等距打卡</option>
            <option value="quantity">按量输入</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" id="target-label">目标次数</label>
          <input class="form-input" id="plan-target" type="number" min="1" placeholder="20" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">进度条颜色</label>
        <div class="color-picker-row" id="color-picker"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-accent" onclick="savePlan()">创建</button>
        <button class="btn" onclick="closeModal('modal-plan')">取消</button>
      </div>
    </div>
  </div>

  <!-- ══ Modal: 打卡 ══ -->
  <div class="modal-overlay" id="modal-checkin">
    <div class="modal">
      <div class="checkin-plan-name" id="ci-name"></div>
      <div class="checkin-info" id="ci-info"></div>
      <div class="form-group" id="ci-qty-group" style="display:none">
        <label class="form-label">本次完成量</label>
        <input class="form-input" id="ci-qty" type="number" min="0.01" step="any" placeholder="输入完成数量" />
      </div>
      <div class="form-actions">
        <button class="btn btn-accent" onclick="submitCheckin()">✓ 确认打卡</button>
        <button class="btn" onclick="closeModal('modal-checkin')">取消</button>
      </div>
    </div>
  </div>

  <!-- ══ Modal: 新建事件 ══ -->
  <div class="modal-overlay" id="modal-event">
    <div class="modal">
      <div class="modal-title">添加重要事件</div>
      <div class="form-group">
        <label class="form-label">事件名称</label>
        <input class="form-input" id="ev-name" placeholder="例如：考试 / 旅行" />
      </div>
      <div class="form-group">
        <label class="form-label">事件描述（可选）</label>
        <input class="form-input" id="ev-desc" placeholder="备注..." />
      </div>
      <div class="form-group">
        <label class="form-label">目标日期</label>
        <input class="form-input" id="ev-date" type="date" />
      </div>
      <div class="form-actions">
        <button class="btn btn-accent" onclick="saveEvent()">添加</button>
        <button class="btn" onclick="closeModal('modal-event')">取消</button>
      </div>
    </div>
  </div>

  <!-- ══ Scripts (loaded in dependency order) ══ -->
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/heatmap.js"></script>
  <script src="js/events.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
